const bindGoogle=c=>{
  const q=x=>c.querySelector(x);
  q('#gsign').onclick=gSignIn;
  q('#gredir').onclick=gRedirect;
  q('#gchoose').onclick=()=>{const gu='https://accounts.google.com/AccountChooser?continue='+encodeURIComponent('https://myaccount.google.com/');gLoadOn('Opening Google in a new tab…');clearTimeout(window.__stk);window.__stk=setTimeout(()=>{if(document.querySelector('.gload')){gLoadOff();showStuck(gu)}},5000);const dn=()=>gLoadOff();window.addEventListener('blur',dn,{once:true});document.addEventListener('visibilitychange',dn,{once:true});ext(gu);window.addEventListener('focus',()=>{const i=c.isConnected&&c.querySelector('#gem');if(i){i.scrollIntoView({block:'center'});i.focus();toast('Enter the account you picked to finish')}},{once:true})};
  q('#gadd').onclick=()=>{const v=q('#gem').value.trim();if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v))return toast('Enter a valid email');const g=GA();let i=g.list.findIndex(a=>a.email===v);if(i<0){g.list.push({sub:'m:'+v,name:v.split('@')[0],email:v,picture:'',verified:0});i=g.list.length-1}g.cur=i;GSET(g);refreshG()};
  q('#gcs').onclick=()=>{const v=q('#gci').value.trim();store('gcid',v||null);toast(v?'Client ID saved':'Client ID removed');if(v)loadGSI().catch(()=>{});refreshG()};
  c.querySelectorAll('[data-gu]').forEach(b=>b.onclick=()=>{const g=GA();g.cur=+b.dataset.gu;GSET(g);refreshG()});
  c.querySelectorAll('[data-gr]').forEach(b=>b.onclick=()=>{const g=GA(),i=+b.dataset.gr;g.list.splice(i,1);if(i<g.cur)g.cur--;g.cur=Math.min(g.cur,g.list.length-1);GSET(g);refreshG()});
  if((store('gcid')||DEFAULT_CID)&&location.protocol!=='file:')loadGSI().catch(()=>{});
};

const go=(v,push=1)=>{
  v=String(v||'').trim();
  if(!v)return;
  const t=tb();
  M.classList.remove('on');
  SW.classList.remove('on');
  U.blur();

  const parsed=normUrl(v);
  if(!parsed)return;
  t.blocked=false;

  if(parsed.type==='gauth_external'){
    t.type='gauth_external';
    t.u=parsed.u;
    t.t=parsed.t;
    t.q='';
    prog(1);
  }else if(parsed.type==='builtin'){
    t.type='builtin';
    t.u=parsed.u;
    t.t=parsed.t;
    t.q='';
    prog(1);
  }else if(parsed.type==='url'){
    t.type='frame';
    t.u=parsed.u;
    t.q='';
    try{t.t=new URL(parsed.u).hostname.replace(/^www\./,'')}catch(e){t.t=parsed.u}
    prog(0);
    setTimeout(()=>prog(1),2200);
  }else{
    t.q=parsed.q;
    t.t=parsed.q;
    if(MODE==='wiki'){
      t.type='wiki';
      t.u='https://en.m.wikipedia.org/w/index.php?search='+encodeURIComponent(parsed.q);
      prog(0);
      fetchWiki(parsed.q,t).then(()=>prog(1));
    }else{
      t.type='frame';
      t.u='https://www.google.com/search?q='+encodeURIComponent(parsed.q)+'&igu=1';
      prog(0);
      setTimeout(()=>prog(1),2200);
    }
  }

  if(push){
    t.H=t.H.slice(0,t.hi+1);
    t.H.push({type:t.type,u:t.u,q:t.q,t:t.t,wikiData:t.wikiData});
    t.hi=t.H.length-1;
  }
  if(t.u&&t.type!=='builtin'&&t.type!=='gauth_external'){
    HL.push([t.t||t.u,t.u]);
    HL=HL.slice(-60);
    store('hl',HL);
  }
  view();
};

const back=()=>{
  const t=tb();
  if(t.hi>0){
    Object.assign(t,t.H[--t.hi]);
    t.blocked=false;
    prog(1);
    view();
  }else if(t.type!=='home'){
    t.hi=-1;
    Object.assign(t,{type:'home',u:'',q:'',t:'New tab',blocked:false});
    prog(1);
    view();
  }
};

const sw=()=>{
  SW.innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px"><span style="font-size:20px">${T.length} ${T.length===1?'tab':'tabs'}</span><div style="display:flex;gap:8px"><button class="btn" id="wca" style="background:var(--sf);color:var(--tx);padding:8px 14px">Close all</button><button class="btn" id="wnt" style="padding:8px 16px">New tab</button></div></div><div class="wtg">${T.map((t,i)=>`<div class="wt ${i===cu?'cu':''}" data-i="${i}" style="animation-delay:${i*40}ms"><div style="display:flex;justify-content:space-between;align-items:center"><span style="display:flex;gap:8px;align-items:center;min-width:0"><span class="ic" style="width:24px;height:24px;border-radius:50%;background:var(--ac);color:var(--on);font-size:12px;box-shadow:none;flex:none">${E((t.t||'N')[0].toUpperCase())}</span><span style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px;font-weight:500">${E(t.t)}</span></span><button class="rb2" data-x="${i}" style="width:28px;height:28px;background:none;flex:none">${svg('x',16)}</button></div><div style="font-size:11.5px;color:var(--tx2);word-break:break-all;line-height:1.35">${E(t.u||'Start page')}</div></div>`).join('')}</div>`;
  SW.querySelectorAll('.wt').forEach(c=>c.onclick=e=>{
    const x=e.target.closest('[data-x]');
    if(x){
      e.stopPropagation();
      if(T[+x.dataset.x].c)T[+x.dataset.x].c.remove();
      T.splice(+x.dataset.x,1);
      if(!T.length)T.push(nt());
      cu=Math.min(cu,T.length-1);
      sw();
      view(1);
      return;
    }
    cu=+c.dataset.i;
    SW.classList.remove('on');
    view(1);
  });
  $('#wnt',SW).onclick=()=>{T.push(nt());cu=T.length-1;SW.classList.remove('on');view()};
  $('#wca',SW).onclick=()=>{T.forEach(x=>x.c&&x.c.remove());T=[nt()];cu=0;SW.classList.remove('on');view()};
};
